<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counters Management - Admin Portal</title>
  <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>Virtual Queue Admin</h2>
      <a href="dashboard.html" class="nav-item">Dashboard</a>
      <a href="services.html" class="nav-item">Services</a>
      <a href="counters.html" class="nav-item active">Counters</a>
      <a href="staff.html" class="nav-item">Staff</a>
      <div style="flex:1;"></div>
      <button class="btn btn-primary" id="logoutBtn" style="width: 100%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);">Logout</button>
    </aside>

    <main class="main-content">
      <header class="header">
        Manage Counters
      </header>
      
      <div class="content-area">
        <div class="panel">
          <h3 style="margin-bottom: 1rem;">Active Counters</h3>
          <table class="data-table">
            <thead>
              <tr>
                <th>Counter Name</th>
                <th>Service ID</th>
                <th>Assigned Staff</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="countersTableBody">
              <tr><td colspan="4" style="text-align:center;">Loading...</td></tr>
            </tbody>
          </table>
        </div>

        <div class="panel" style="max-width: 600px;">
          <h3 style="margin-bottom: 1rem;">Add New Counter</h3>
          <form id="addCounterForm">
            <div class="form-grid">
              <div class="form-group">
                <label>Counter Name</label>
                <input type="text" id="counterName" required placeholder="e.g. Window 1">
              </div>
              <div class="form-group">
                <label>Service</label>
                <select id="counterService" required>
                  <option value="">Select Service...</option>
                </select>
              </div>
            </div>
            <div id="counterMsg" style="margin-bottom: 1rem; font-weight: 500;"></div>
            <button type="submit" class="btn btn-primary">Create Counter</button>
          </form>
        </div>
      </div>
    </main>
  </div>
  <script src="/admin/assets/admin.js"></script>
</body>
</html>
