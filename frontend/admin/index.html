<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Virtual Queue</title>
  <link rel="stylesheet" href="/admin/assets/admin.css">
  <style>
    body { display: flex; justify-content: center; align-items: center; background: #e0e7ff; }
    .login-panel { width: 100%; max-width: 400px; padding: 2rem; background: white; border-radius: 8px; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
  </style>
</head>
<body>
  <div class="login-panel">
    <h2 style="margin-bottom: 1.5rem; text-align: center;">Admin Portal</h2>
    <form id="loginForm">
      <div class="form-group">
        <label>Organization Code</label>
        <input type="text" id="orgSlug" required value="city-hospital">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required>
      </div>
      <div id="errorMsg" style="color: red; margin-bottom: 1rem; display: none;"></div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
    </form>
  </div>
  <script src="/admin/assets/admin.js"></script>
</body>
</html>
