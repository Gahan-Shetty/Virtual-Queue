<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Management - Admin Portal</title>
  <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <a href="/admin/dashboard.html" style="text-decoration: none; color: inherit;"><h2>Virtual Queue Admin</h2></a>
      <a href="/admin/dashboard.html" class="nav-item">Dashboard</a>
      <a href="/admin/services.html" class="nav-item">Services</a>
      <a href="/admin/counters.html" class="nav-item">Counters</a>
      <a href="/admin/staff.html" class="nav-item active">Staff</a>
      <div style="flex:1;"></div>
      <button class="btn btn-primary" id="logoutBtn" style="width: 100%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);">Logout</button>
    </aside>

    <main class="main-content">
      <header class="header">
        Manage Staff
      </header>
      
      <div class="content-area">
        <div class="panel">
          <h3 style="margin-bottom: 1rem;">Active Staff</h3>
          <table class="data-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Email</th>
                <th>Phone</th>
              </tr>
            </thead>
            <tbody id="staffTableBody">
              <tr><td colspan="4" style="text-align:center;">Loading...</td></tr>
            </tbody>
          </table>
        </div>

        <div class="panel" style="max-width: 600px;">
          <h3 style="margin-bottom: 1rem;">Add New Staff</h3>
          <form id="addStaffForm">
            <div class="form-grid">
              <div class="form-group">
                <label>Name</label>
                <input type="text" id="staffName" required>
              </div>
              <div class="form-group">
                <label>Email</label>
                <input type="email" id="staffEmail" required>
              </div>
              <div class="form-group">
                <label>Phone</label>
                <input type="tel" id="staffPhone" required>
              </div>
              <div class="form-group">
                <label>Password</label>
                <input type="text" id="staffPassword" required minlength="8" value="ChangeMe123!">
              </div>
              <div class="form-group">
                <label>Role</label>
                <select id="staffRole" required>
                  <option value="RECEPTIONIST">Receptionist</option>
                  <option value="DOCTOR">Doctor</option>
                </select>
              </div>
            </div>
            <div id="staffMsg" style="margin-bottom: 1rem; font-weight: 500;"></div>
            <button type="submit" class="btn btn-primary">Create Staff Account</button>
          </form>
        </div>
      </div>
    </main>
  </div>
  <script src="/admin/assets/admin.js"></script>
</body>
</html>
