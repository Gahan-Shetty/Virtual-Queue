<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Patient Portal</title>
  <link rel="stylesheet" href="assets/patient.css">
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1 class="display-title">Your Token</h1>
      <p class="text-muted" id="patientName">Welcome</p>
    </header>

    <!-- State 0: Account Verification Needed -->
    <div class="card" id="verifyAccountCard" style="display: none;">
      <h3 class="text-center" style="margin-bottom: 0.5rem;">Verify Your Account</h3>
      <p class="text-muted text-center mb-4">Please verify your account to start managing and requesting tokens.</p>

      <div id="otpSendStep">
        <div class="form-group">
          <label for="otpViaSelect">Send Verification Code Via</label>
          <select id="otpViaSelect">
            <option value="email">Email OTP</option>
            <option value="phone">SMS / Phone OTP</option>
          </select>
        </div>
        <p id="otpSendMsg" class="text-center text-sm mb-4" style="display: none; font-weight: 500;"></p>
        <button id="sendOtpBtn" type="button" class="mt-2">Send OTP</button>
      </div>

      <div id="otpVerifyStep" style="display: none; margin-top: 1.5rem;">
        <div class="form-group">
          <label for="otpCodeInput">Enter 6-Digit OTP Code</label>
          <input type="text" id="otpCodeInput" placeholder="123456" maxlength="6" style="text-align: center; font-size: 1.25rem; letter-spacing: 0.25em;">
        </div>
        <p id="otpVerifyError" class="error-text"></p>
        <p id="otpVerifySuccess" class="text-center text-sm mb-4" style="display: none; color: var(--status-called); font-weight: 500;"></p>
        <button id="verifyOtpBtn" type="button" class="mt-2">Verify Account</button>
        <p class="text-center mt-4 text-sm">
          Didn't receive code? <a href="#" id="resendOtpLink" style="color: var(--accent-color); text-decoration: none;">Resend OTP</a>
        </p>
      </div>
    </div>

    <!-- State 1: No active token -->
    <div class="card text-center" id="noTokenState" style="display: none;">
      <h3>No Active Reservation</h3>
      <p class="text-muted mb-4">You do not have a token for today.</p>
      <a href="request.html"><button>Request a Token</button></a>
    </div>

    <!-- State 2: Active token -->
    <div class="card" id="activeTokenState" style="display: none;">
      <div class="token-display">
        <span class="status-badge" id="tokenStatus">Loading...</span>
        <div class="token-number" id="tokenNumber">---</div>
        <p class="text-muted" id="serviceName">---</p>
      </div>

      <div class="qr-container" id="qrContainer" style="display: none;">
        <img id="qrCode" src="" alt="Check-in QR Code">
        <p class="text-sm text-muted text-center mt-4">Show this to staff to check in</p>
      </div>

      <div class="queue-info">
        <div class="stat-box">
          <div class="stat-value" id="queuePosition">--</div>
          <div class="stat-label">Position</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="estWait">-- min</div>
          <div class="stat-label">Est. Wait</div>
        </div>
      </div>
      
      <p id="systemMessage" class="text-center mt-4" style="color: var(--status-waiting); font-weight: 500;"></p>

      <button id="cancelBtn" class="btn-secondary mt-4">Cancel Reservation</button>
    </div>
  </div>

  <script src="assets/patient.js"></script>
</body>
</html>
