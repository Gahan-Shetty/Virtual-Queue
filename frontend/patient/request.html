<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Token - Patient Portal</title>
  <link rel="stylesheet" href="assets/patient.css">
</head>
<body>
  <div class="container">
    <header>
      <h1 class="display-title">Request Token</h1>
      <p class="text-muted">Select a service to join the virtual queue</p>
    </header>

    <div class="card">
      <form id="requestForm">
        <div class="form-group">
          <label for="serviceSelect">Select Service</label>
          <select id="serviceSelect" required>
            <option value="">Loading services...</option>
          </select>
        </div>
        <p id="requestError" class="error-text"></p>
        <button type="submit" class="mt-4" id="requestBtn">Request Token</button>
      </form>
    </div>
    
    <div class="text-center mt-4">
      <a href="dashboard.html" style="color: var(--text-secondary); text-decoration: none;">&larr; Back to Dashboard</a>
    </div>
  </div>

  <script src="assets/patient.js"></script>
</body>
</html>
