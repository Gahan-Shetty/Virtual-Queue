<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Console - Staff Portal</title>
  <link rel="stylesheet" href="/staff/assets/staff.css">
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <a href="/staff/console.html" style="text-decoration: none; color: inherit;"><h2>Virtual Queue</h2></a>
      <a href="/staff/console.html" class="nav-item active">Queue Console</a>
      <a href="/staff/walkin.html" class="nav-item" id="navWalkin" style="display:none;">New Walk-in</a>
      <a href="/staff/checkin.html" class="nav-item" id="navCheckin" style="display:none;">QR Check-in</a>
      <div style="flex:1;"></div>
      <div id="staffInfo" style="margin-bottom: 1rem; font-size: 0.875rem; color: var(--text-secondary);"></div>
      <button class="btn btn-outline" id="logoutBtn" style="width: 100%;">Logout</button>
    </aside>

    <main class="main-content">
      <header class="header">
        <div class="flex-gap">
          <select id="serviceSelect" class="btn btn-outline" style="background: white;">
            <option value="">Select Service...</option>
          </select>
          <select id="counterSelect" class="btn btn-outline" style="background: white;">
            <option value="">Select Counter...</option>
          </select>
        </div>
        <div class="flex-gap">
          <button class="btn btn-primary" id="callNextBtn">Call Next</button>
        </div>
      </header>
      
      <div class="content-area">
        <div class="panel" style="margin-bottom: 1.5rem;" id="activePatientPanel" style="display:none;">
          <h3 style="margin-bottom: 1rem;">Currently Serving</h3>
          <div class="flex-between">
            <div>
              <div style="font-size: 2rem; font-weight: bold;" id="activeToken">--</div>
              <div id="activeName" style="color: var(--text-secondary);">No patient called</div>
            </div>
            <div class="flex-gap">
              <button class="btn btn-success" id="btnServing" disabled>Mark Arrived</button>
              <button class="btn btn-primary" id="btnComplete" disabled>Complete</button>
              <button class="btn btn-danger" id="btnNoShow" disabled>No-Show</button>
            </div>
          </div>
        </div>

        <table class="data-table">
          <thead>
            <tr>
              <th>Pos</th>
              <th>Token</th>
              <th>Patient</th>
              <th>Status</th>
              <th>Wait Time</th>
            </tr>
          </thead>
          <tbody id="queueTableBody">
            <tr><td colspan="5" style="text-align:center;">Select a service to view queue</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
  <script src="/staff/assets/staff.js"></script>
</body>
</html>
