<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login - Virtual Queue</title>
  <link rel="stylesheet" href="assets/staff.css">
  <style>
    .login-container { max-width: 400px; margin: 100px auto; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="panel">
      <h2 style="margin-bottom: 1rem;">Staff Portal</h2>
      <form id="loginForm">
        <div class="form-group">
          <label>Organization Code</label>
          <input type="text" id="orgSlug" required value="city-hospital">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required>
        </div>
        <div id="errorMsg" style="color: red; margin-bottom: 1rem; display: none;"></div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
      </form>
    </div>
  </div>
  <script src="assets/staff.js"></script>
</body>
</html>
